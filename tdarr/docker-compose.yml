services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - serverIP=tdarr
      - serverPort=8266
      - webUIPort=8265
    volumes:
      - /home/abed_23/apps/tdarr/tdarr/server:/app/server
      - /home/abed_23/apps/tdarr/tdarr/configs:/app/configs
      - /home/abed_23/apps/tdarr/tdarr/logs:/app/logs
      - /mnt/streaming:/data
      # CRITICAL: temp must be on the same drive as media. /mnt/streaming/tdarr
      # is a sibling of /mnt/streaming/media on the same filesystem, so a
      # finished transcode is a rename, not a multi-GB copy.
      - /mnt/streaming/tdarr:/temp
    ports:
      - 8265:8265
      - 8266:8266
    restart: unless-stopped
    networks:
      - caddy_net

  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - serverIP=tdarr
      - serverPort=8266
      - nodeName=thinkpad-node
      # NVENC on the RTX 2070 Super. No Intel iGPU on this host.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # NVENC on the RTX 2070 Super -- no iGPU here, so /dev/dri and GID 991 are
    # both gone. Requires the NVIDIA Container Toolkit on the host; Tdarr's docs
    # warn that `runtime: nvidia` only works once `docker info` actually lists an
    # `nvidia` runtime, which is what `nvidia-ctk runtime configure` sets up.
    #
    # NOTE: this makes the GPU visible to the node. It does NOT migrate the
    # transcode stack -- see README gotcha 12, this node's flows are QSV plugins.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /home/abed_23/apps/tdarr/tdarr/configs:/app/configs
      - /home/abed_23/apps/tdarr/tdarr/logs:/app/logs
      - /mnt/streaming:/data
      - /mnt/streaming/tdarr:/temp
    restart: unless-stopped
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
