services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest 
    container_name: seerr
    init: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PORT=5055
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /home/abed_23/apps/streaming/jellyseerr/config:/app/config 
    ports:
      - 5055:5055
    restart: unless-stopped
    networks:
      - caddy_net

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # One GPU, and it's the RTX 2070 Super. There is no Intel iGPU on this host,
      # so /dev/dri does not exist, GID 991 is meaningless, and the
      # jellyfin-opencl-intel DOCKER_MOD was removed -- an Intel-only mod on an
      # NVIDIA box is a container that starts and then fails to transcode.
      #
      # NVENC/NVDEC only. Host prerequisites: NVIDIA driver (nvidia-smi must work)
      # and the NVIDIA Container Toolkit (`nvidia-ctk runtime configure
      # --runtime=docker`) so `docker info` lists an `nvidia` runtime.
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    runtime: nvidia
    volumes:
      - /home/abed_23/apps/streaming/jellyfin/config:/config
      # Whole streaming drive at /data (read-only: Jellyfin never writes here).
      # Libraries are /data/media/movies and /data/media/tv -- update both in
      # Dashboard > Libraries after first boot.
      - /mnt/streaming/media:/data:ro
    ports:
      - 8096:8096
    restart: unless-stopped
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
