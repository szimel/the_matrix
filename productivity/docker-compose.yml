services:
  actual-server:
    image: actualbudget/actual-server:latest
    container_name: actual-server
    restart: unless-stopped
    ports:
      - '5006:5006'
    volumes:
      - /mnt/actual-data:/data
    networks:
      - caddy_net

  productivity-feed:
    image: ghcr.io/szimel/youtube-lobotomy:main
    container_name: youtube-replacer
    restart: unless-stopped
    ports:
      # The image binds gunicorn to PORT=8080 and its healthcheck probes the same
      # value, so the container side must stay 8080. Publishing 9090:9090 left the
      # host port dead and made Caddy answer 502.
      - 9090:8080
    environment:
      JEV_API_KEY: ${JEV_API_KEY}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - /home/abed_23/apps/productivity/productivity-feed/data:/app/data
    networks:
      caddy_net:
        # The service is named productivity-feed but the container is not, so give
        # the container the service name as a DNS alias on caddy_net. This is what
        # makes the Caddyfile's `reverse_proxy productivity-feed:9090` resolve.
        aliases:
          - productivity-feed

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SIGNUPS_ALLOWED=false
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/productivity/vaultwarden/data:/data
    ports:
      - 8080:80
    restart: unless-stopped
    networks:
      - caddy_net

  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VIKUNJA_SERVICE_PUBLICURL=${VIKUNJA_URL}
      - TZ=${TZ}
      - VIKUNJA_OUTGOINGREQUESTS_ALLOWNONROUTABLEIPS=true
    ports:
      - 3456:3456
    volumes:
      - /home/abed_23/apps/productivity/vikunja/files:/app/vikunja/files
      - /home/abed_23/apps/productivity/vikunja/db:/db
    restart: unless-stopped
    networks:
      - caddy_net

  notifications:
    build: ./notifications
    container_name: notifications
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - VIKUNJA_URL=${VIKUNJA_URL}
      - MEALIE_URL=${MEALIE_URL}
    ports:
      - 8001:8001
    restart: unless-stopped
    networks:
      - caddy_net
      
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    ports:
      - 8085:80
    networks:
      - caddy_net
      
  bentopdf:
    image: bentopdf/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - 8086:8080
    networks:
      - caddy_net

  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/productivity/freshrss/config:/config
    ports:
      - 8087:80
    restart: unless-stopped
    networks:
      - caddy_net

  mealie:
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MEALIE_URL=${MEALIE_URL}
      - HTTP_ALLOW_LIST=notifications
    volumes:
      - /home/abed_23/apps/productivity/mealie/data:/app/data/
    ports:
      - 9925:9000 # Maps Mealie's internal port 9000 to 9925 on your host
    restart: unless-stopped
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
