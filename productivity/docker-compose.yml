services:
  actual-server:
    image: actualbudget/actual-server:latest
    container_name: actual-server
    restart: unless-stopped
    ports:
      - '5006:5006'
    volumes:
      - /mnt/actual-data:/data
    networks:
      - caddy_net

  productivity-feed:
    image: ghcr.io/szimel/youtube-lobotomy:main
    container_name: youtube-replacer
    restart: unless-stopped
    ports:
      - 9090:8080
    environment:
      JEV_API_KEY: ${JEV_API_KEY}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - /home/abed_23/apps/productivity/productivity-feed/data:/app/data
    networks:
      caddy_net:
        aliases:
          - productivity-feed

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SIGNUPS_ALLOWED=false
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/productivity/vaultwarden/data:/data
    ports:
      - 8080:80
    restart: unless-stopped
    networks:
      - caddy_net
      
  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    ports:
      - 8085:80
    networks:
      - caddy_net
      
  bentopdf:
    image: bentopdf/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - 8086:8080
    networks:
      - caddy_net

  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/productivity/freshrss/config:/config
    ports:
      - 8087:80
    restart: unless-stopped
    networks:
      - caddy_net

  sharry:
    image: eikek0/sharry:latest
    container_name: sharry
    ports:
      - "8090:9090"
    environment:
      - SHARRY_BASE_URL=https://share.bigdaddyz.com
    volumes:
      - /home/abed_23/apps/productivity/sharry/data:/data
    networks:
      - caddy_net
    restart: unless-stopped

networks:
  caddy_net:
    external: true
