services:
  actual-server:
    image: actualbudget/actual-server:latest
    container_name: actual-server
    restart: unless-stopped
    ports:
      - '5006:5006'
    volumes:
      - /mnt/library/actual-data:/data
    networks:
      - caddy_net

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SIGNUPS_ALLOWED=false
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/productivity/vaultwarden/data:/data
    ports:
      - 8080:80
    restart: unless-stopped
    networks:
      - caddy_net

  omni-tools:
    image: iib0011/omni-tools:latest
    container_name: omni-tools
    restart: unless-stopped
    ports:
      - 8085:80
    networks:
      - caddy_net

  bentopdf:
    image: bentopdf/bentopdf:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - 8086:8080
    networks:
      - caddy_net

  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: freshrss
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/productivity/freshrss/config:/config
    ports:
      - 8087:80
    restart: unless-stopped
    networks:
      - caddy_net
      
  sharry:
    image: eikek0/sharry:latest
    container_name: sharry
    command: /opt/sharry.conf
    environment:
      - SHARRY_BASE_URL=${SHARRY_BASE_URL}
      - SHARRY_BIND_ADDRESS=0.0.0.0
      - SHARRY_BACKEND_SIGNUP_MODE=closed
    ports:
      - 8090:9090
    volumes:
      - /home/abed_23/apps/productivity/sharry/sharry.conf:/opt/sharry.conf:ro
      - /home/abed_23/apps/productivity/sharry/data:/data
      # MIGRATION: was /mnt/media/inbox. /mnt/media no longer exists, so this
      # would otherwise start as an empty auto-created folder. I parked it on
      # the streaming drive to keep Sharry working -- move it if you'd rather
      # this lived somewhere else.
      - /mnt/streaming/inbox:/inbox
    networks:
      - caddy_net
    restart: unless-stopped

networks:
  caddy_net:
    external: true
