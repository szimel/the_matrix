services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - TZ=${TZ}
      - AUDIO_TTS_OPENAI_PARAMS={"response_format":"wav"}

      # ── Lean-out: everything model-ish is remote via OpenRouter ──
      - ENABLE_IMAGE_GENERATION=false # HIGH — already default, keep explicit
      # ENABLE_RAG_LOCAL_WIKI: "false"   # HIGH
      - UVICORN_WORKERS=1             # HIGH — each extra worker is a full copy of the app

      # document extraction -> tika (the default pypdf path leaks memory)
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998

      # sqlite footprint
      - DATABASE_POOL_SIZE=8
      - DATABASE_SQLITE_PRAGMA_CACHE_SIZE=-2000
      - DATABASE_SQLITE_PRAGMA_MMAP_SIZE=0
      - DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=300
      - ENABLE_REALTIME_CHAT_SAVE=false

      # cpu
      - ENABLE_COMPRESSION_MIDDLEWARE=false
      - ENABLE_ORJSON=true
      # testing for higher timeouts
      - AIOHTTP_CLIENT_TIMEOUT=300

      # web search reads pages via the separate playwright container below
      # (never let OWUI install Chromium into itself — set PLAYWRIGHT_WS_URL)
      - WEB_LOADER_ENGINE=playwright
      # host is `gluetun`, not `playwright`: the container shares gluetun's
      # namespace, so its name never exists on the wire from caddy_net
      - PLAYWRIGHT_WS_URL=ws://gluetun:3000
    volumes:
      - /home/abed_23/apps/AI/open-webui/data:/app/backend/data
    ports:
      - 8081:8080
    restart: unless-stopped
    networks:
      - caddy_net

  tika:
    image: apache/tika:latest
    container_name: tika
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m
    networks:
      - caddy_net

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    environment:
        - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
        - /home/abed_23/apps/AI/open-terminal:/home/user
    mem_limit: 1g            # hard ceiling
    mem_reservation: 256m    
    networks:
      - caddy_net

  doormouse:
    image: ghcr.io/darksworm/doormouse:latest
    container_name: doormouse
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/abed_23/apps/AI/doormouse/config.toml:/app/config.toml:ro

  actual-mcp:
    image: sstefanov/actual-mcp:latest
    container_name: actual-mcp
    restart: unless-stopped
    # --sse = HTTP mode (streamable-http + legacy SSE); default is stdio, which Open WebUI can't use
    # --enable-write = REQUIRED for your Target-split flow (update-transaction writes)
    # --enable-bearer = refuses connections without the token below
    command:
      - --sse
      - --enable-write
      - --enable-bearer
    environment:
      ACTUAL_SERVER_URL: "https://budget.bigdaddyz.com"
      ACTUAL_PASSWORD: ${ACTUAL_PASSWORD}
      # ACTUAL_BUDGET_ENCRYPTION_PASSWORD: "xyz"     # uncomment ONLY if your budget has a separate E2E encryption password
      # ACTUAL_BUDGET_SYNC_ID: "budget-id"           # uncomment only if you run multiple budgets
      BEARER_TOKEN: ${BEARER_TOKEN}
    networks:
      - caddy_net

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble  # MUST match the playwright@x.y.z in command below AND OWUI's requirements.txt
    container_name: playwright
    command: npx -y playwright@1.60.0 run-server --port 3000 --host [IP_ADDRESS]
    # JS-rendering page loader for Open WebUI (WEB_LOADER_ENGINE=playwright).
    # Rides the Mullvad exit like searxng does, so page renders are anonymous too.
    # Idle ~100MB (server only); chromium spawns per page load and exits, mem_limit caps the peak.
    network_mode: "container:gluetun"
    restart: unless-stopped
    mem_limit: 1g

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    # Web search backend for Open WebUI (Admin Settings -> Web Search).
    # ALL of its outbound traffic exits through Mullvad: this container joins
    # gluetun's network namespace (the same trick transmission uses), so only
    # SearXNG rides the VPN — nothing else in this stack does.
    # Cross-stack note: gluetun lives in /media, so `service:gluetun` won't
    # resolve here — `container:gluetun` is required, which means /media must
    # be up first AND if gluetun is ever RECREATED (new container), recreate
    # searxng too or it keeps a dead namespace.
    network_mode: "container:gluetun"
    restart: unless-stopped
    volumes:
      # settings.yml is untracked (holds secret_key) — lives on the host next to this stack's other app dirs
      - /home/abed_23/apps/AI/searxng/settings.yml:/etc/searxng/settings.yml:ro

networks:
  caddy_net:
    external: true
