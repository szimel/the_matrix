services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    environment:
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - TZ=${TZ}
      # Once Ollama exists on Cloudy Matrix, uncomment this and add OLLAMA_BASE_URL
      # to this stack's Dockhand environment. Use the cloud box's Tailscale name or
      # 100.x.y.z address -- never its public IP, because Ollama has no auth at all.
      # - OLLAMA_BASE_URL=http://cloudy-matrix:11434

      # ── Lean-out: everything model-ish is remote via OpenRouter ──
      - ENABLE_TTS_API_SERVER=false   # HIGH confidence this is the var + default
      - ENABLE_IMAGE_GENERATION=false # HIGH — already default, keep explicit
      - WHISPER_MODEL=tiny   #  HIGH on name, MEDIUM that "tiny" is the value
      # ENABLE_RAG_LOCAL_WIKI: "false"   # HIGH
      - UVICORN_WORKERS=1             # HIGH — each extra worker is a full copy of the app

      # document extraction -> tika (the default pypdf path leaks memory)
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998

      # sqlite footprint
      - DATABASE_POOL_SIZE=8
      - DATABASE_SQLITE_PRAGMA_CACHE_SIZE=-2000
      - DATABASE_SQLITE_PRAGMA_MMAP_SIZE=0
      - DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL=300
      - ENABLE_REALTIME_CHAT_SAVE=false

      # audio / embeddings -> OpenRouter, no local models
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_KEY=${WEBUI_SECRET_KEY}
      - AUDIO_STT_OPENAI_API_BASE_URL=https://openrouter.ai/api/v1
      - BYPASS_PYDUB_PREPROCESSING=true

      # background task inference off
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false

      # openrouter has ~1000 models
      - ENABLE_BASE_MODELS_CACHE=true
      - MODELS_CACHE_TTL=300

      # cpu
      - ENABLE_COMPRESSION_MIDDLEWARE=false
      - ENABLE_ORJSON=true
    volumes:
      - /home/abed_23/apps/AI/open-webui/data:/app/backend/data
    ports:
      - 8081:8080
    restart: unless-stopped
    networks:
      - caddy_net

  tika:
    image: apache/tika:latest
    container_name: tika
    restart: unless-stopped
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m
    networks:
      - caddy_net

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    environment:
        - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    volumes:
        - /home/abed_23/apps/AI/open-terminal:/home/user
    mem_limit: 1g            # hard ceiling
    mem_reservation: 256m    
    networks:
      - caddy_net
 

networks:
  caddy_net:
    external: true
