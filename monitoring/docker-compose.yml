services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_APP_URL}
    volumes:
      - /home/abed_23/apps/monitoring/beszel_data:/beszel_data
      - /home/abed_23/apps/monitoring/beszel_socket:/beszel_socket
    networks:
      - caddy_net

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/abed_23/apps/monitoring/beszel_agent_data:/var/lib/beszel-agent
      - /home/abed_23/apps/monitoring/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: ${BESZEL_HUB_URL}
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}
      
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
