services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=privado
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PRIVADO_USER}
      - OPENVPN_PASSWORD=${PRIVADO_PASSWORD}
      - SERVER_COUNTRIES=${PRIVADO_COUNTRY}
      - SERVER_CITIES=${SERVER_CITY}
      - TZ=${TZ}
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
      # slskd's web UI. slskd lives in /music but rides this namespace, so its
      # port has to be published here. The Soulseek listen port is deliberately
      # NOT published: nothing forwards it, and inbound tunnel traffic would
      # land inside the namespace directly with no Docker mapping at all.
      - 5030:5030
    restart: unless-stopped
    networks:
      caddy_net:
        # /music's slskd has no network interface of its own, so it has no DNS
        # name on caddy_net. This alias is what keeps the Caddyfile's existing
        # `reverse_proxy slskd:5030` resolving — same trick as
        # `productivity-feed` in /productivity.
        aliases:
          - slskd

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/transmission/config:/config
      - /mnt/streaming:/data
    network_mode: "service:gluetun"
    restart: unless-stopped
    stop_grace_period: 30s

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/sabnzbd/config:/config
      - /mnt/streaming:/data
    ports:
      - 8083:8080
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - caddy_net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - caddy_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/radarr/config:/config
      - /mnt/streaming:/data
    ports:
      - 7878:7878
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - caddy_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/sonarr/config:/config
      - /mnt/streaming:/data
    ports:
      - 8989:8989
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - caddy_net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - caddy_net

  # cleanuparr:
  #   image: ghcr.io/cleanuparr/cleanuparr:latest
  #   container_name: cleanuparr
  #   restart: unless-stopped
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #     - PORT=11011
  #   volumes:
  #     - /home/abed_23/apps/media/cleanuparr/config:/config
  #   ports:
  #     - 11011:11011
  #   networks:
  #     - caddy_net

networks:
  caddy_net:
    external: true
