services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # PrivadoVPN via the Privado account bundled with the Eweka Usenet plan.
      # Gluetun's built-in `privado` provider is OpenVPN-only (no WireGuard).
      # Privado does not offer port forwarding, so 51413 below is outbound-only.
      - VPN_SERVICE_PROVIDER=privado
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PRIVADO_USER}
      - OPENVPN_PASSWORD=${PRIVADO_PASSWORD}
      - SERVER_COUNTRIES=${PRIVADO_COUNTRY}
      - SERVER_CITIES=${SERVER_CITY}
      - TZ=${TZ}
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    networks:
      - caddy_net

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/transmission/config:/config
      - /mnt/media:/media
    network_mode: "service:gluetun"
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    # Deliberately NOT behind gluetun: Usenet traffic is SSL-encrypted to the
    # provider end-to-end, so the VPN adds nothing here but latency. Only
    # transmission (torrents) needs the tunnel.
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/sabnzbd/config:/config
      - /mnt/media:/media
    ports:
      - 8083:8080
    restart: unless-stopped
    networks:
      - caddy_net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - caddy_net

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/radarr/config:/config
      - /mnt/media:/media
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - caddy_net

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/sonarr/config:/config
      - /mnt/media:/media
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - caddy_net

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/bazarr/config:/config
      # read-write on purpose: Bazarr writes .srt sidecars next to the media files
      - /mnt/media:/media
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - caddy_net

  unmanic:
    image: josh5/unmanic:latest
    container_name: unmanic
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/media/unmanic/config:/config
      - /mnt/media:/media
    ports:
      - 8888:8888
    # Intel Quick Sync passthrough, same pattern jellyfin uses
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "991"
    restart: unless-stopped
    networks:
      - caddy_net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - caddy_net

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - PORT=11011
    volumes:
      - /home/abed_23/apps/media/cleanuparr/config:/config
    ports:
      - 11011:11011
    networks:
      - caddy_net
      

networks:
  caddy_net:
    external: true
