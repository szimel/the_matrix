services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ND_SCANINTERVAL=1m
      - ND_AUTOUPDATE=true
    volumes:
      - /home/abed_23/apps/music/navidrome/config:/data
      - /mnt/media/music:/music
    ports:
      - 4533:4533
    restart: unless-stopped
    networks:
      - caddy_net

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/music/slskd:/app
      - /mnt/media/downloads/soulseek:/downloads
      - /mnt/media/music:/uploads
    ports:
      - 5030:5030
      - 50300:50300
    restart: unless-stopped
    networks:
      - caddy_net

  soulsync:
    image: ghcr.io/nezreka/soulsync:latest
    container_name: soulsync
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/music/soulsync/config:/app/config
      - /home/abed_23/apps/music/soulsync/logs:/app/logs
      - /home/abed_23/apps/music/soulsync/data:/app/data
      - /mnt/media/downloads/soulseek:/app/downloads
      - /mnt/media/music:/music
      - /mnt/media/songs:/app/Staging
    ports:
      - 8008:8008
    restart: unless-stopped
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
