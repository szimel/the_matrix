services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ND_SCANINTERVAL=1m
      - ND_AUTOUPDATE=true
    volumes:
      - /home/abed_23/apps/music/navidrome/config:/data
      - /mnt/media/music:/music
    ports:
      - 4533:4533
    restart: unless-stopped
    networks:
      - caddy_net

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/music/slskd:/app
      - /mnt/media/downloads/soulseek:/downloads
      - /mnt/media/music:/uploads
    # Rides /media's existing gluetun instead of carrying its own tunnel.
    # `container:gluetun` is the only form that works across compose projects —
    # `service:gluetun` only resolves inside a single file.
    #
    # Accepted consequences (all of them live in media/docker-compose.yml):
    #   - gluetun publishes 5030 and carries the `slskd` network alias, because
    #     a namespace has one set of ports and one DNS name
    #   - no depends_on across projects: if gluetun isn't up at boot, this
    #     container fails to start and Docker retries with backoff
    #   - if gluetun is ever recreated, this one is stranded on a dead
    #     namespace — fix with `docker compose up -d --force-recreate slskd`
    #
    # No `ports:` and no `networks:` here: both belong to the container that
    # owns the namespace, and Compose refuses to combine network_mode with
    # networks anyway.
    #
    # Privado offers no port forwarding, so the Soulseek listen port is not
    # published anywhere and the client stays "firewalled" on the network:
    # it can reach peers that have an open port, and peers that only accept
    # open-port clients skip it. Accepted trade — slower downloads in exchange
    # for not handing the home IP to every stranger it downloads from.
    # If a forwarding provider ever replaces Privado: add
    # FIREWALL_VPN_INPUT_PORTS=<port> to gluetun and set soulseek.listen_port
    # in slskd.yml to the same number.
    network_mode: "container:gluetun"
    restart: unless-stopped

  soulsync:
    image: ghcr.io/nezreka/soulsync:latest
    container_name: soulsync
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /home/abed_23/apps/music/soulsync/config:/app/config
      - /home/abed_23/apps/music/soulsync/logs:/app/logs
      - /home/abed_23/apps/music/soulsync/data:/app/data
      - /mnt/media/downloads/soulseek:/app/downloads
      - /mnt/media/music:/music
      - /mnt/media/songs:/app/Staging
    ports:
      - 8008:8008
    restart: unless-stopped
    networks:
      - caddy_net

networks:
  caddy_net:
    external: true
